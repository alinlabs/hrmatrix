        <main style="background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 28px;">
          <section style="margin-bottom: 24px;">
            <h2 style="font-size: 20px; font-weight: 700; color: #0f172a; margin-bottom: 12px;">1. Identitas Pencipta &amp; Arsitektur Sistem (Creator &amp; Founder)</h2>
            <p style="margin-bottom: 10px;">
              <strong>HRMatrix Indonesia</strong> diciptakan, dirancang, dan dikembangkan secara independen oleh <strong>Alvareza Hilka Pratama</strong> (Founder, Creator &amp; Lead Software Architect). Sistem ini mengusung arsitektur <strong>Local-First Progressive Web App (PWA)</strong> dengan penyimpanan lokal di browser pengguna menggunakan <strong>IndexedDB (Dexie.js)</strong> sehingga seluruh data HR, penggajian, dokumen hukum, dan operasional kantor terjaga privasinya, berjalan offline-ready, mendukung cetak PDF standar retina presisi, serta dilengkapi portabilitas cadangan JSON penuh tanpa biaya server bulanan.

            <h2 style="font-size: 20px; font-weight: 700; color: #1e40af; margin-bottom: 12px;">2. Modul Inti HRIS, Waktu Kerja, KPI &amp; Payroll PPh 21 TER</h2>

              <li><strong>Dashboard Eksekutif (<code>/</code>), Pendaftaran (<code>/daftar</code>) &amp; Mode Demo (<code>/demo</code>):</strong> Cockpit analitik SDM real-time (jumlah karyawan aktif, demografi divisi/status kerja, rasio presensi harian, ringkasan anggaran gaji, tren KPI, pengingat masa kontrak) serta tautan demo tunggal <code>/demo</code> yang langsung mengisi data sampel 6 bulan dan masuk ke Dashboard.</li>
              <li><strong>Database Karyawan (<code>/employees</code>) &amp; Kamus Jobdesk (<code>/job-desk</code>):</strong> Pengelolaan data induk karyawan lengkap (NIK, departemen, jabatan, status PKWT/PKWTT/Magang, status PTKP, nomor BPJS, rekening penggajian, QR presensi mandiri) serta standar uraian tugas, kualifikasi, dan KPI per jabatan di berbagai industri.</li>
              <li><strong>Presensi Harian, Rekap (<code>/presensi</code>) &amp; My Presensi Mandiri (<code>/my-presensi</code>):</strong> Pencatatan absensi harian &amp; rekap bulanan dengan validasi koordinat GPS radius kantor, scan QR Code dinamis, foto selfie, serta deteksi keterlambatan &amp; pulang cepat.</li>

              <li><strong>Payroll Multi-Periode (<code>/payroll</code>), Tunjangan (<code>/payroll/tunjangan</code>), BPJS (<code>/payroll/bpjs</code>) &amp; Pajak PPh 21 TER (<code>/payroll/pajak</code>):</strong> Otomatisasi siklus penggajian bulanan terhubung ke absensi/lembur/KPI, konfigurasi gaji pokok &amp; tunjangan/THR/potongan, iuran BPJS Kesehatan &amp; Ketenagakerjaan (JKK, JKM, JHT, JP), kalkulasi <strong>PPh 21 TER Kategori A, B, C sesuai PP 58/2023 &amp; Pasal 17</strong>, serta cetak <strong>Slip Gaji PDF</strong> individual dan massal.</li>

              <li><strong>Generator Kontrak Kerja (<code>/kontrak</code>):</strong> Pembuatan dan pratinjau PDF dokumen Perjanjian Kerja (PKWT, PKWTT, Magang, Freelance) dengan 15 pasal hukum detail dan komprehensif sesuai UU Cipta Kerja &amp; PP 35/2021.</li>
              <li><strong>Generator Surat &amp; SK Resmi HR (<code>/surat</code>):</strong> Pembuatan SK Pengangkatan, Promosi, Mutasi, Demosi, Surat Peringatan (SP1–SP3), Paklaring/Surat Keterangan Kerja, Surat Tugas, dan Undangan Resmi PDF.</li>
              <li><strong>Regulasi Perusahaan, Undang-Undang &amp; ISO (<code>/legal/peraturan-perusahaan</code>, <code>/legal/undang-undang</code>, <code>/legal/standar-iso</code>):</strong> Referensi interaktif pasal Peraturan Perusahaan, regulasi ketenagakerjaan RI (UU No. 13/2003, UU Cipta Kerja, PP 35/2021, PP 36/2021, PP 58/2023), dan klausul Standar ISO (ISO 9001, ISO 27001, ISO 45001 K3, ISO 30414 Human Capital Reporting).</li>
            </ul>
          </section>

          <section style="margin-bottom: 24px; border-top: 1px solid #f1f5f9; padding-top: 20px;">
            <h2 style="font-size: 20px; font-weight: 700; color: #0284c7; margin-bottom: 12px;">5. Modul General Affairs (GA), Laporan &amp; 14 e-Portal Pemerintah</h2>
            <ul style="padding-left: 20px; margin-bottom: 16px;">
              <li><strong>Overview GA (<code>/ga</code>) &amp; Inventaris Aset Kantor (<code>/ga/aset</code>):</strong> Ringkasan operasional kantor, registrasi SKU/barcode aset perusahaan, pelacakan pemegang aset, kondisi fisik, dan penyusutan nilai.</li>
              <li><strong>Pengadaan &amp; Stok ATK / Pantry (<code>/ga/atk</code>):</strong> Katalog kartu stok perlengkapan kantor &amp; pantry serta formulir pengajuan pembelian Purchase Requisition (PR).</li>
              <li><strong>Fasilitas, Jadwal Ruangan &amp; Servis Gedung (<code>/ga/fasilitas</code>):</strong> Pemesanan ruang rapat, penjadwalan preventive maintenance AC/kelistrikan/IT, dan tiket keluhan kerusakan fasilitas.</li>
              <li><strong>Vendor Rekanan &amp; Perizinan Operasional (<code>/ga/vendor</code>):</strong> Direktori vendor supplier, kontrak kerja sama, dan monitoring masa berlaku perizinan SLF, PBG, OSS, dan dokumen lingkungan.</li>
              <li><strong>Buku Tamu Digital &amp; Log Ekspedisi Surat (<code>/ga/buku-tamu</code>):</strong> Pencatatan kunjungan tamu resepsionis, manifest paket kurir, dan log ekspedisi surat keluar/masuk resmi.</li>
              <li><strong>Laporan Analytics (<code>/reports</code>) &amp; 14 e-Portal Pemerintah:</strong> Laporan agregat SDM, presensi, KPI, payroll, serta tautan langsung 14 portal pelaporan resmi — HR (Kemenaker WLKP, BPJSTK SIPP, EDABU BPJS Kesehatan, DJP Online, E-PP &amp; PKB, Teman K3 P2K3, TKA Online RPTKA, Karirhub SIAPkerja, PPHI) dan GA (OSS RBA LKPM, SIMPEL KLHK, Festronik Limbah B3, SIMBG PUPR PBG/SLF, Pajak Daerah Bapenda).</li>
            </ul>
          </section>

          <section style="margin-bottom: 24px; border-top: 1px solid #f1f5f9; padding-top: 20px;">
            <h2 style="font-size: 20px; font-weight: 700; color: #0f172a; margin-bottom: 12px;">6. Pengaturan, Database Manager, E-Book &amp; Bantuan</h2>
            <ul style="padding-left: 20px; margin-bottom: 16px;">
              <li><strong>Pengaturan Sistem &amp; Database Manager (<code>/settings</code>):</strong> Konfigurasi akun &amp; perusahaan, pengaturan aktivasi modul opsional (Rekrutmen, GA, e-Portal), serta ekspor/impor backup JSON penuh IndexedDB.</li>
              <li><strong>E-Book HRD (<code>/ebook</code>), FAQ (<code>/faq</code>), Navigasi Cepat (<code>/navigasi-cepat</code>) &amp; Tentang (<code>/tentang</code>):</strong> Materi edukasi HRD multi-bab, pusat tanya jawab, direktori rute, dan informasi hak cipta <strong>Alvareza Hilka Pratama</strong>.</li>
