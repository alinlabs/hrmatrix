          <h1 style="font-size: 28px; font-weight: 800; color: #0f172a; margin-bottom: 8px;">HRMatrix Indonesia - Solusi Terpadu Aplikasi HRD, Tools GA &amp; Software Payroll</h1>
          <p style="font-size: 16px; color: #475569;">Ekosistem Manajemen SDM (Human Resources) dan General Affair (GA) Terlengkap di Indonesia • Diciptakan &amp; Didirikan oleh <strong>Alvareza Hilka Pratama</strong></p>
        </header>

        <main style="background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 28px;">
          <section style="margin-bottom: 24px;">
            <h2 style="font-size: 20px; font-weight: 700; color: #1e40af; margin-bottom: 12px;">1. Aplikasi HRD &amp; Tools HR Terlengkap (Human Resource Management)</h2>
            <p style="margin-bottom: 12px;">HRMatrix merupakan <strong>aplikasi HRD</strong> dan <strong>tools HR gratis</strong> terdepan untuk efisiensi divisi personalia dan HRD perusahaan di Indonesia:</p>
            <ul style="padding-left: 20px; margin-bottom: 16px;">
              <li><strong>Database Karyawan &amp; Personalia:</strong> Pengelolaan arsip data induk karyawan, struktur organisasi hierarkis, riwayat jabatan, dan dokumen kepegawaian.</li>
              <li><strong>Aplikasi Absensi Online &amp; Presensi GPS:</strong> Pencatatan presensi masuk dan pulang real-time dengan validasi koordinat GPS radius kantor dan scan QR Code dinamis.</li>
              <li><strong>Manajemen Roster Shift Kerja:</strong> Penataan kalender jadwal kerja bergilir, matriks shift multi-divisi, serta approval tukar shift otomatis antar karyawan.</li>
              <li><strong>Manajemen Cuti &amp; Izin Karyawan:</strong> Pantau saldo cuti tahunan, pengajuan cuti online, izin sakit, dan verifikasi persetujuan atasan secara instan.</li>
              <li><strong>Software Payroll &amp; Slip Gaji PDF:</strong> Otomatisasi perhitungan gaji bersih (take home pay), tunjangan tetap/variabel, upah lembur resmi, dan cetak slip gaji format PDF.</li>
              <li><strong>Kalkulator Pajak PPh 21 TER &amp; BPJS:</strong> Integrasi tarif efektif rata-rata (TER) PP 58/2023 (Kategori A, B, C) serta iuran BPJS Kesehatan dan BPJS Ketenagakerjaan (JKK, JKM, JHT, JP).</li>
              <li><strong>Evaluasi Kinerja &amp; KPI:</strong> Penyusunan Key Performance Indicators bulanan berbobot, review kinerja tim, dan katalog indikator KPI nasional siap pakai.</li>
              <li><strong>Applicant Tracking System (ATS) &amp; Asesmen Online:</strong> Publikasi lowongan kerja, tracking berkas CV pelamar, tes psikotes online (DISC, TPA kognitif, tes integritas SJT, dan English).</li>
            </ul>
          </section>

          <section style="margin-bottom: 24px; border-top: 1px solid #f1f5f9; pt: 20px;">
            <h2 style="font-size: 20px; font-weight: 700; color: #0284c7; margin-bottom: 12px;">2. Aplikasi GA &amp; Tools General Affair Modern (Office &amp; Facilities Management)</h2>
            <p style="margin-bottom: 12px;">Dirancang khusus untuk tim General Affair (GA), HRMatrix menyediakan suite <strong>aplikasi GA kantor</strong> dan <strong>tools GA</strong> terlengkap untuk mengendalikan operasional gedung:</p>
            <ul style="padding-left: 20px; margin-bottom: 16px;">
              <li><strong>Manajemen Inventaris &amp; Aset Kantor:</strong> Registrasi nomor inventaris/SKU, barcode pelacakan aset perusahaan, kondisi fisik, nilai depresiasi berkala, dan penanggung jawab aset.</li>
              <li><strong>Pengadaan ATK &amp; Purchase Requisition (PR):</strong> Formulir pengajuan pembelian ATK, alur persetujuan bertingkat, dan kontrol kartu stok perlengkapan kantor agar tidak terjadi pemborosan.</li>
              <li><strong>Pemeliharaan Fasilitas &amp; Tiket Maintenance Gedung:</strong> Helpdesk tiket servis perbaikan AC, kelistrikan, sanitasi, dan penjadwalan pemeliharaan preventif fasilitas kantor.</li>
              <li><strong>Direktori Vendor &amp; Perizinan Usaha:</strong> Database vendor rekanan terverifikasi, riwayat kontrak kerja sama, dan pemantauan masa berlaku perizinan operasional (SLF, PBG, Amdal).</li>
              <li><strong>Buku Tamu Digital &amp; Ekspedisi Surat:</strong> Resepsionis digital untuk pencatatan buku tamu kantor, manifest paket kurir, serta buku ekspedisi surat masuk dan surat keluar resmi.</li>
            </ul>
